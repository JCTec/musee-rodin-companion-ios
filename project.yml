name: MuseeRodinCompanion
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MuseeRodinCompanion:
    type: application
    platform: iOS
    sources:
      - path: MuseeRodinCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jctec.MuseeRodinCompanion
        INFOPLIST_FILE: MuseeRodinCompanion/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - MuseeRodinCompanionTests
        - MuseeRodinCompanionUITests
  MuseeRodinCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MuseeRodinCompanionTests
    resources:
      - path: MuseeRodinCompanion/Resources/Content
    dependencies:
      - target: MuseeRodinCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jctec.MuseeRodinCompanionTests
        GENERATE_INFOPLIST_FILE: YES
  MuseeRodinCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MuseeRodinCompanionUITests
    dependencies:
      - target: MuseeRodinCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jctec.MuseeRodinCompanionUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MuseeRodinCompanion:
    build:
      targets:
        MuseeRodinCompanion: all
    test:
      gatherCoverageData: true
      targets:
        - MuseeRodinCompanionTests
        - MuseeRodinCompanionUITests
