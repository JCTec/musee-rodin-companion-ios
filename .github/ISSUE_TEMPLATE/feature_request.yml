name: Feature request
description: Propose an app feature, workflow improvement, or GitHub automation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the app or repo workflow help someone do?
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: User story
      placeholder: "As a visitor/researcher/maintainer, I want..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be done?
  - type: textarea
    id: notes
    attributes:
      label: Notes or constraints
      description: Include links, screenshots, design references, or implementation notes.
